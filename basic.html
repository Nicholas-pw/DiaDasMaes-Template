<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Para a minha mãe ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    /* ══════════════════════════════
       CORES — mude aqui se quiser
    ══════════════════════════════ */
    :root {
      --bg:       #fef9f5;
      --rose:     #d4788a;
      --rose-lt:  #f2c4cd;
      --text:     #3d2b2b;
      --muted:    #a07878;
      --card:     #fff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Lato', sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.2rem;
      overflow-x: hidden;
    }

    /* pétalas de fundo */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle 320px at 10% 20%, #fde8ee88 0%, transparent 70%),
        radial-gradient(circle 280px at 90% 80%, #fde0d288 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── CARTÃO CENTRAL ── */
    .card {
      background: var(--card);
      border-radius: 28px;
      box-shadow: 0 12px 50px -12px rgba(180, 80, 100, .18);
      max-width: 440px;
      width: 100%;
      padding: 2.8rem 2.4rem 2.4rem;
      text-align: center;
      position: relative;
      opacity: 0;
      animation: rise .9s .1s ease forwards;
    }

    /* faixa decorativa topo */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: linear-gradient(90deg, transparent, var(--rose), transparent);
    }

    /* ── FOTO ── */
    .photo-wrap {
      width: 120px; height: 120px;
      margin: 0 auto 1.6rem;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--rose-lt);
      box-shadow: 0 6px 24px -6px rgba(180, 80, 100, .28);
      background: linear-gradient(135deg, #fde8ee, #fde0d2);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: .9rem;
      color: var(--rose);
    }

    .photo-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* ── DATA ── */
    .date {
      font-size: .68rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .6rem;
    }

    /* ── TÍTULO ── */
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      font-weight: 400;
      line-height: 1.15;
      color: var(--text);
    }

    h1 span {
      display: block;
      color: var(--rose);
      font-style: italic;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: .7rem;
      margin: 1.4rem 0;
      color: var(--rose-lt);
      font-size: .9rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rose-lt);
    }

    /* ── MENSAGEM ── */
    .msg {
      font-size: clamp(.95rem, 3vw, 1.1rem);
      line-height: 1.8;
      color: var(--text);
      font-weight: 300;
    }
    .msg em { font-style: italic; color: var(--rose); font-weight: 400; }

    /* ── BOTÃO SURPRESA ── */
    .btn {
      display: inline-block;
      margin-top: 2rem;
      padding: .85rem 2.2rem;
      border-radius: 50px;
      border: none;
      background: var(--rose);
      color: #fff;
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-style: italic;
      cursor: pointer;
      box-shadow: 0 8px 24px -6px rgba(180, 80, 100, .4);
      transition: transform .25s, box-shadow .25s;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 14px 28px -6px rgba(180, 80, 100, .45); }
    .btn:active { transform: scale(.97); }

    /* ── MENSAGEM SURPRESA (inline) ── */
    .surprise-box {
      display: none;
      margin-top: 1.4rem;
      background: #fef0f3;
      border: 1px solid var(--rose-lt);
      border-radius: 18px;
      padding: 1.2rem 1.4rem;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(.95rem, 3vw, 1.1rem);
      color: var(--rose);
      line-height: 1.7;
      animation: pop .4s ease;
    }

    .surprise-box.show { display: block; }

    /* ── RODAPÉ ── */
    .footer {
      margin-top: 1.8rem;
      font-size: .72rem;
      color: var(--muted);
      letter-spacing: .06em;
    }

    /* ── ANIMAÇÕES ── */
    @keyframes rise {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(.92); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="card">

  <div class="photo-wrap" id="photoWrap">Foto 1</div>

  <p class="date" id="dataHoje"></p>

  <h1>
    Feliz Dia das Mães,
    <span id="nomeMae">Mamãe</span>
  </h1>

  <div class="divider">❤</div>

  <p class="msg" id="mensagem">
    Mãe, obrigada por tudo. Você é meu maior amor.
  </p>

  <button class="btn" id="btnSurpresa">💌 Abrir mensagem especial</button>

  <div class="surprise-box" id="surpriseBox" id="surpriseTexto">
    Eu te amo mais do que palavras conseguem dizer. 🌸
  </div>

  <p class="footer" id="rodape">feito com amor ❤️</p>
</div>

<script>
  /* ╔══════════════════════════════════════════════╗
     ║  ✏️  EDITE AQUI — só este bloco!             ║
     ╚══════════════════════════════════════════════╝ */
  const CONFIG = {

    /* 👩 Nome da mãe */
    nome_mae: "Mamãe",

    /* 💬 Mensagem — use <br> para quebrar linha, <em>texto</em> para itálico */
    mensagem: `Mãe, obrigada por cada abraço, cada conselho e cada momento ao seu lado.<br>
      <em>Você é meu lar onde quer que eu esteja.</em>`,

    /* 📸 Foto — cole o link da imagem (ou deixe "" para não usar) */
    foto: "foto1.png",

    /* 🎁 Mensagem surpresa (aparece ao clicar no botão) */
    surpresa: "Eu te amo mais do que palavras conseguem dizer. 🌸",

    /* 👇 Texto do botão */
    btn_texto: "💌 Abrir mensagem especial",

  };
  /* 🚫 PARE AQUI */

  /* aplica tudo */
  document.getElementById("nomeMae").textContent   = CONFIG.nome_mae;
  document.getElementById("mensagem").innerHTML    = CONFIG.mensagem;
  document.getElementById("btnSurpresa").textContent = CONFIG.btn_texto;

  const box = document.getElementById("surpriseBox");
  box.innerHTML = CONFIG.surpresa;

  /* foto */
  if (CONFIG.foto) {
    const wrap = document.getElementById("photoWrap");
    wrap.innerHTML = "";
    const img = document.createElement("img");
    img.src = CONFIG.foto;
    img.alt = "Foto da mãe";
    wrap.appendChild(img);
  }

  /* data automática */
  const d = new Date();
  document.getElementById("dataHoje").textContent =
    d.toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" });

  /* botão surpresa */
  document.getElementById("btnSurpresa").addEventListener("click", function() {
    box.classList.toggle("show");
    this.textContent = box.classList.contains("show") ? "✕ Fechar" : CONFIG.btn_texto;
  });
</script>
</body>
</html>
